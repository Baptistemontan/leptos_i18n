[package]
name = "leptos_i18n_codegen"
version = { workspace = true }
edition = "2024"
authors = ["Baptiste de Montangon"]
license = "MIT"
repository = "https://github.com/Baptistemontan/leptos_i18n"
description = "codegen crate for the leptos_i18n crate"
readme = "../README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[dependencies]
proc-macro2 = { workspace = true, default-features = true }
quote = { workspace = true, default-features = true }
syn = { workspace = true, default-features = true, features = ["extra-traits"] }
icu_locale = { workspace = true, features = [
  "compiled_data",
], default-features = false }
leptos_i18n_parser = { workspace = true }
tinystr = { workspace = true, default-features = false }

[features]
default = []
islands = []
dynamic_load = []
hydrate = []
csr = []
ssr = []
plurals = ["leptos_i18n_parser/plurals"]
format_datetime = ["leptos_i18n_parser/format_datetime"]
format_list = ["leptos_i18n_parser/format_list"]
format_nums = ["leptos_i18n_parser/format_nums"]
format_currency = ["leptos_i18n_parser/format_currency", "format_nums"]
all_formats = [
  "plurals",
  "format_datetime",
  "format_list",
  "format_nums",
  "format_currency",
]

[package.metadata.cargo-all-features]
denylist = [
  "nightly",
  # formats, only tested together through the "all_formats" feature
  "plurals",
  "format_datetime",
  "format_list",
  "format_nums",
  "format_currency",
]
skip_feature_sets = [
  # Only one of `csr`, `hydrate` and `ssr` should be enabled at once
  [
    "csr",
    "hydrate",
  ],
  [
    "csr",
    "ssr",
  ],
  [
    "hydrate",
    "ssr",
  ],
]
